<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Address Book ' + ${addressBook.id}">Address Book</title>
</head>
<body>
<a th:href="@{/}">Back to all address books</a>

<h1 th:text="'Address Book #' + ${addressBook.id}">Address Book</h1>

<p th:if="${#lists.isEmpty(addressBook.buddyList)}">This address book has no buddies yet.</p>

<table border="1" th:unless="${#lists.isEmpty(addressBook.buddyList)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Nickname</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddyList}">
        <td th:text="${buddy.id}">1</td>
        <td th:text="${buddy.name}">Name</td>
        <td th:text="${buddy.email}">email@example.com</td>
        <td th:text="${buddy.phone}">000-000-0000</td>
        <td th:text="${buddy.address}">Address</td>
        <td th:text="${buddy.nickname}">Nickname</td>
    </tr>
    </tbody>
</table>

<h2>Add a Buddy</h2>

<form th:action="@{/view/addressbooks/{id}/buddies(id=${addressBook.id})}" th:object="${newBuddy}" method="post">
    <table>
        <tr>
            <td><label for="name">Name:</label></td>
            <td><input type="text" id="name" th:field="*{name}" required></td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td><input type="text" id="email" th:field="*{email}"></td>
        </tr>
        <tr>
            <td><label for="phone">Phone:</label></td>
            <td><input type="text" id="phone" th:field="*{phone}"></td>
        </tr>
        <tr>
            <td><label for="address">Address:</label></td>
            <td><input type="text" id="address" th:field="*{address}"></td>
        </tr>
        <tr>
            <td><label for="nickname">Nickname:</label></td>
            <td><input type="text" id="nickname" th:field="*{nickname}"></td>
        </tr>
    </table>
    <input type="submit" value="Add Buddy">
</form>
</body>
</html>
