<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Address Books</title>
</head>
<body>
<h1>Address Books</h1>

<p th:if="${#lists.isEmpty(addressBooks)}">No address books yet.</p>

<table border="1" th:unless="${#lists.isEmpty(addressBooks)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Buddies</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${addressBooks}">
        <td><a th:href="@{/view/addressbooks/{id}(id=${book.id})}"
               th:text="'Address Book #' + ${book.id}">Address Book</a></td>
        <td th:text="${#lists.size(book.buddyList)}">0</td>
    </tr>
    </tbody>
</table>

<br>

<form th:action="@{/view/addressbooks}" method="post">
    <input type="submit" value="Create New Address Book">
</form>
</body>
</html>
